plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    implementation "com.terraformersmc:modmenu:20.0.1"
}

processResources {
    inputs.property "mod_id", "pas"
    inputs.property "mod_name", "Player Armor Stands Lite"
    inputs.property "mod_version", project.mod_version
    inputs.property "mod_description", "Armor stands look like players. Modified from Danrus' PAS. Simplified code with performance improvements."
    inputs.property "mod_author", "Danrus, ExtraJuiceMan"
    inputs.property "mod_license", "MIT"
    inputs.property "mod_issue_tracker", "https://github.com/ExtraJuiceMan/PlayerArmorStandsLite/issues"
    inputs.property "minecraft_versions", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand project.properties + [
            mod_id: "pas", mod_name: "Player Armor Stands Lite",
            mod_version: project.mod_version,
            mod_description: "Armor stands look like players. Modified from Danrus' PAS. Simplified code with performance improvements.",
            mod_author: "Danrus, ExtraJuiceMan", mod_license: "MIT",
            mod_issue_tracker: "https://github.com/ExtraJuiceMan/PlayerArmorStandsLite/issues",
            minecraft_versions: project.minecraft_version
        ]
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${archiveBaseName.get()}" }
    }
}
